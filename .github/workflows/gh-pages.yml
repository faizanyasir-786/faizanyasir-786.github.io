name: Portfolio
on:
  push:
    branches: [ master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16.14.2
      - run: npm install
      - run: npm run-script build
      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}